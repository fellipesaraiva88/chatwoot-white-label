<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="200px" viewBox="0 0 800 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Auzap Logo</title>
    <desc>Auzap - Atendimento inteligente para o setor PET</desc>
    <g id="Logo" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Icon: Chat bubble with paw print -->
        <g id="icon" transform="translate(20, 30)">
            <!-- Outer circle -->
            <circle fill="#06B6D4" cx="70" cy="70" r="70"></circle>

            <!-- Chat bubble -->
            <path d="M 70,35 C 90,35 105,50 105,70 C 105,90 90,105 70,105 C 65,105 60,104 56,102 L 40,110 L 45,94 C 38,88 35,79 35,70 C 35,50 50,35 70,35 Z"
                  fill="#FFFFFF" opacity="0.95"></path>

            <!-- Paw print inside bubble -->
            <g transform="translate(55, 55)" fill="#06B6D4">
              <!-- Main pad -->
              <ellipse cx="15" cy="20" rx="8" ry="10"></ellipse>
              <!-- Toe pads -->
              <ellipse cx="8" cy="10" rx="4" ry="5"></ellipse>
              <ellipse cx="15" cy="8" rx="4" ry="5"></ellipse>
              <ellipse cx="22" cy="10" rx="4" ry="5"></ellipse>
            </g>
        </g>

        <!-- Text: AUZAP -->
        <g id="text" transform="translate(180, 60)">
            <text font-family="system-ui, -apple-system, Arial, sans-serif"
                  font-size="90"
                  font-weight="700"
                  fill="#1F2937"
                  letter-spacing="2">
                <tspan x="0" y="70">Auzap</tspan>
            </text>
        </g>
    </g>
</svg>
